<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gregory</title>
<meta name="description" content="Gregory 个人封面——头像、姓名与个性签名。">
<style>
  :root{
    --brand:#FF6B35;
    --brand-dark:#D9480F;
    --ink:#1f2430;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);line-height:1.6;
  }

  .cover{
    position:relative;overflow:hidden;
    min-height:100svh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:64px 24px;
    background:
      radial-gradient(120% 90% at 85% -10%, rgba(255,107,53,.18), transparent 55%),
      radial-gradient(120% 90% at -10% 110%, rgba(217,72,15,.16), transparent 55%),
      linear-gradient(165deg,#FFF6EF 0%,#FFE7D8 50%,#FFD9C4 100%);
  }
  .cover .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;z-index:0;}
  .cover .blob.a{width:340px;height:340px;background:var(--brand);top:-90px;right:-60px;}
  .cover .blob.b{width:300px;height:300px;background:var(--brand-dark);bottom:-100px;left:-70px;}
  .cover-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:760px;width:100%;}

  .avatar{
    width:clamp(150px,30vw,220px);height:clamp(150px,30vw,220px);
    border-radius:32px;overflow:hidden;background:#fff;
    border:6px solid #fff;
    box-shadow:0 18px 48px rgba(217,72,15,.28),0 4px 14px rgba(0,0,0,.12);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}

  .name{
    margin-top:30px;font-size:clamp(40px,9vw,76px);font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }

  .sign{
    position:relative;margin-top:28px;padding:0 8px;
    max-width:600px;font-size:clamp(16px,4.2vw,21px);color:#41464f;
    font-style:italic;line-height:1.9;
  }
  .sign::before{
    content:"\201C";position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    font-size:60px;line-height:1;color:var(--brand);opacity:.35;font-family:Georgia,serif;
  }

  /* 极轻入口：不参与封面视觉重心 */
  .tools-entry{
    position:fixed;right:30px;bottom:26px;z-index:5;
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(31,36,48,.36);text-decoration:none;
    padding:8px 0;
    transition:color .2s ease;
  }
  .tools-entry::after{content:"\2197";font-size:12px;letter-spacing:0;}
  .tools-entry:hover{color:var(--brand-dark);}

  @media(max-width:600px){
    .cover{padding:48px 18px;}
    .avatar{border-width:5px;border-radius:26px;}
    .tools-entry{right:20px;bottom:16px;font-size:10px;letter-spacing:.16em;}
  }
</style>
</head>
<body>

<section class="cover">
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="cover-inner">
    <div class="avatar">
      <img src="assets/avatar.jpg" alt="Gregory 头像">
    </div>
    <h1 class="name">Gregory</h1>
    <blockquote class="sign">目前为止还觉得这个世界挺有意思，还在寻找跟它更好相处的方式</blockquote>
  </div>
</section>

<a class="tools-entry" href="tools.html">Tools</a>

</body>
</html>
