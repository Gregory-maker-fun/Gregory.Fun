<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调拨托运单生成器</title>
<style>
  :root{
    --brand:#E5352B;          /* 鸣鸣很忙 品牌红 */
    --brand-d:#B52219;
    --acc:#FF6B35;            /* 橘红强调 */
    --ink:#1a1a1a;
    --line:#2b2b2b;
    --soft:#faf6f0;
    --bg:#eef0f2;
    --panel:#ffffff;
    --mut:#7a7a7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;}
  body{background:var(--bg);color:var(--ink);padding:18px;line-height:1.5;}
  /* ===== 顶栏 ===== */
  .topbar{max-width:1180px;margin:0 auto 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .topbar .logo{display:flex;align-items:center;gap:10px;}
  .topbar .logo img{height:30px;width:auto;}
  .topbar h1{font-size:20px;letter-spacing:1px;}
  .topbar h1 small{display:block;font-size:11px;color:var(--mut);font-weight:normal;letter-spacing:2px;margin-top:2px;}
  .topbar .spacer{flex:1;}
  .topbar .btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{padding:9px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;transition:.15s;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-d);}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  .btn.ghost:hover{background:var(--soft);}
  .btn.muted{background:#e7e9ec;color:#555;}
  .btn.muted:hover{background:#d9dce0;}

  /* ===== 主栅格 ===== */
  .wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start;}
  .panel{background:var(--panel);border-radius:10px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .panel h2{font-size:14px;color:var(--brand);border-left:4px solid var(--brand);padding-left:8px;margin-bottom:12px;letter-spacing:1px;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:12px;color:#555;margin-bottom:4px;}
  .field input,.field textarea{width:100%;padding:8px 9px;border:1px solid #d4d7db;border-radius:6px;font-size:13px;background:#fcfcfd;transition:.15s;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(255,107,53,.12);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field textarea{resize:vertical;min-height:48px;}

  /* 商品明细录入 */
  .goods-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;}
  .goods-head .ttl{font-size:13px;font-weight:bold;color:#333;}
  .gtable{width:100%;border-collapse:collapse;}
  .gtable th{font-size:11px;color:#666;font-weight:normal;text-align:left;padding:3px 4px;border-bottom:1px solid #e3e6ea;}
  .gtable td{padding:3px 4px;}
  .gtable input{width:100%;padding:6px 7px;border:1px solid #d4d7db;border-radius:5px;font-size:12px;}
  .gtable input.qty{text-align:center;}
  .gtable .del{background:#fbe9e7;color:var(--brand);border:none;border-radius:5px;cursor:pointer;font-size:12px;padding:5px 8px;font-weight:bold;}
  .gtable .del:hover{background:#f6d4d0;}
  .addrow{margin-top:8px;width:100%;background:var(--soft);color:var(--brand);border:1px dashed var(--brand);border-radius:6px;padding:8px;cursor:pointer;font-size:12px;font-weight:bold;}
  .addrow:hover{background:#fff1ea;}
  .sumhint{font-size:12px;color:var(--mut);margin-top:6px;text-align:right;}
  .sumhint b{color:var(--brand);font-size:14px;}

  /* ===== 预览 / 单据 ===== */
  .preview-box{background:#f4f5f7;border-radius:10px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  #sheet{background:#fff;width:100%;max-width:820px;margin:0 auto;border:2px solid var(--line);}
  .sheet-head{padding:16px 10px 4px;text-align:center;}
  .sheet-head img{display:block;margin:0 auto 6px;height:44px;width:auto;}
  .sheet-brandbar{display:flex;align-items:center;gap:12px;padding:0 10px 10px;}
  .sheet-brandbar .sep{flex:1;height:1px;background:linear-gradient(90deg,rgba(229,53,43,0),var(--brand));}
  .sheet-brandbar .sep:last-child{background:linear-gradient(90deg,var(--brand),rgba(229,53,43,0));}
  .sheet-title{font-size:21px;font-weight:bold;letter-spacing:4px;}
  .sheet-sub{font-size:12px;color:#9a9a9a;text-align:center;padding:0 0 8px;letter-spacing:2px;}
  table.doc{width:calc(100% - 16px);margin:0 8px;border-collapse:collapse;table-layout:fixed;}
  table.doc td{border:1px solid var(--line);text-align:center;font-size:14px;padding:7px 4px;height:34px;word-break:break-all;}
  .lbl{background:var(--soft);font-weight:bold;color:#4a3a2a;white-space:nowrap;}
  .hd{background:var(--brand);color:#fff;font-weight:bold;}
  .total{color:var(--brand);font-weight:bold;}
  .gitem td:first-child{font-weight:bold;}
  .signrow td{height:54px;background:#fff;font-size:14px;padding:0 22px;vertical-align:middle;}
  .signrow .sigbar{display:flex;align-items:flex-end;gap:60px;}
  .signrow .sigitem{display:flex;align-items:flex-end;white-space:nowrap;}
  .signrow .sig{border-bottom:1px solid #888;display:inline-block;width:110px;height:20px;margin-left:8px;}
  .remark{padding:8px 10px 12px;font-size:12px;color:#666;}

  .foot{max-width:1180px;margin:14px auto 0;font-size:11px;color:#9aa0a6;text-align:center;}

  @media(max-width:880px){
    .wrap{grid-template-columns:1fr;}
  }
  /* ===== 打印：只出单据 ===== */
  @media print{
    body{background:#fff;padding:0;}
    .topbar,.panel,.preview-box>*:not(#sheet),.foot{display:none !important;}
    .preview-box{background:#fff;padding:0;box-shadow:none;}
    #sheet{border-width:1.5px;max-width:none;}
    @page{margin:10mm;}
  }
</style>
</head>

      </div>
      <div class="sheet-brandbar"><span class="sep"></span><div class="sheet-title">物流调拨托运单</div><span class="sep"></span></div>
      <div class="sheet-sub" id="p_sub">发货仓：—　|　收货仓：—</div>
      <table class="doc">
        <colgroup><col style="width:18%"><col style="width:32%"><col style="width:18%"><col style="width:32%"></colgroup>
        <tr><td class="lbl">调出仓</td><td id="p_out">—</td><td class="lbl">调入仓</td><td id="p_in">—</td></tr>
        <tr><td class="lbl">发货日期</td><td id="p_date">—</td><td class="lbl">发货件数</td><td class="total" id="p_qty">0</td></tr>
        <tr><td class="lbl">发货人</td><td id="p_sender">—</td><td class="lbl">手机号</td><td id="p_phone">—</td></tr>
        <tr><td class="lbl">司机姓名</td><td id="p_driver">—</td><td class="lbl">司机电话</td><td id="p_dphone">—</td></tr>
        <tr><td class="lbl">车牌号</td><td colspan="3" id="p_plate">—</td></tr>
        <tr><td class="lbl">调拨单号</td><td class="total" colspan="3" id="p_no" style="letter-spacing:1px">—</td></tr>
        <tr><td class="hd">商品名称</td><td class="hd">编码</td><td class="hd" colspan="2">件数</td></tr>
        <tbody id="p_goods"></tbody>
        <tr class="signrow">
          <td colspan="4"><div class="sigbar">
            <span class="sigitem">签收人：<span class="sig"></span></span>
            <span class="sigitem">件数：<span class="sig"></span></span>
          </div></td>
        </tr>
      </table>
      <div class="remark" id="p_remark"></div>
    </div>
  </div>
</div>

<div class="foot">本工具为纯本地单文件，数据仅暂存于本机浏览器（关闭即清），不上传任何服务器。</div>

<script>
const KEY="transfer_note_v1";
const $=id=>document.getElementById(id);
const fields=["f_out","f_in","f_date","f_sender","f_phone","f_driver","f_dphone","f_plate","f_no","f_remark"];

function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function genNo(){const d=new Date();const p=n=>String(n).padStart(2,"0");return "CTR"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"0001";}

// 商品行
function addRow(name="",code="",qty=""){
  const tb=$("gbody");const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="gname" value="${name}" placeholder="商品名称"></td>
    <td><input class="gcode" value="${code}" placeholder="编码"></td>
    <td><input class="gqty qty" value="${qty}" inputmode="numeric" placeholder="0"></td>
    <td><button class="del" onclick="this.closest('tr').remove();refresh()">✕</button></td>`;
  tb.appendChild(tr);
  tr.querySelectorAll("input").forEach(i=>i.addEventListener("input",saveAndRefresh));
}
function getGoods(){return [...$("gbody").children].map(tr=>({
  name:tr.querySelector(".gname").value,
  code:tr.querySelector(".gcode").value,
  qty:tr.querySelector(".gqty").value
}));}

function computeSum(){let s=0;getGoods().forEach(g=>{const n=parseFloat(g.qty);if(!isNaN(n))s+=n;});return s;}

function refresh(){
  // 同步预览
  $("p_out").textContent=$("f_out").value||"—";
  $("p_in").textContent=$("f_in").value||"—";
  $("p_date").textContent=$("f_date").value||"—";
  $("p_sender").textContent=$("f_sender").value||"—";
  $("p_phone").textContent=$("f_phone").value||"—";
  $("p_driver").textContent=$("f_driver").value||"—";
  $("p_dphone").textContent=$("f_dphone").value||"—";
  $("p_plate").textContent=$("f_plate").value||"—";
  $("p_no").textContent=$("f_no").value||"—";
  $("p_sub").textContent="发货仓："+($("f_out").value||"—")+"　|　收货仓："+($("f_in").value||"—");
  $("p_remark").textContent="备注："+($("f_remark").value||"");

  const sum=computeSum();
  $("f_qty").value=sum;
  $("p_qty").textContent=sum;
  $("sumview").textContent=sum;

  // 商品明细预览
  const pb=$("p_goods");pb.innerHTML="";
  getGoods().forEach(g=>{
    if(!g.name&&!g.code&&!g.qty)return;
    const tr=document.createElement("tr");tr.className="gitem";
    tr.innerHTML=`<td>${esc(g.name)}</td><td>${esc(g.code)}</td><td class="total" colspan="2">${esc(g.qty)||0}</td>`;
    pb.appendChild(tr);
  });
  if(!pb.children.length){
    pb.innerHTML=`<tr><td colspan="4" style="color:#bbb">（暂无商品，请在左侧添加）</td></tr>`;
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// 自动单号：日期变化且未手动改过时重算
let noTouched=false;
$("f_date").addEventListener("change",()=>{if(!noTouched){const d=$("f_date").value.replace(/-/g,"");$("f_no").value="CTR"+d+"0001";saveAndRefresh();}});
$("f_no").addEventListener("input",()=>{noTouched=true;saveAndRefresh();});

// 暂存（file:// 下可能不可用，做容错）
function save(){try{
  const data={fields:{},goods:getGoods()};
  fields.forEach(f=>data.fields[f]=$(f).value);
  localStorage.setItem(KEY,JSON.stringify(data));
}catch(e){}}
function saveAndRefresh(){save();refresh();}
function load(){try{
  const raw=localStorage.getItem(KEY);if(!raw)return false;
  const data=JSON.parse(raw);
  fields.forEach(f=>{if(data.fields[f]!==undefined)$(f).value=data.fields[f];});
  $("gbody").innerHTML="";(data.goods||[]).forEach(g=>addRow(g.name,g.code,g.qty));
  if(!data.goods||!data.goods.length)addRow();
  noTouched=!!data.fields.f_no;
  return true;
}catch(e){return false;}}

function clearAll(){if(!confirm("确定清空所有内容并重置为空白单据？"))return;
  fields.forEach(f=>$(f).value="");$("f_date").value=todayStr();$("f_no").value=genNo();noTouched=false;
  $("gbody").innerHTML="";addRow();save();refresh();}

function saveHTML(){
  refresh();
  const clone=$("sheet").outerHTML;
  const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>调拨托运单 ${$("f_no").value}</title>
<style>
:root{--brand:#E5352B;--line:#2b2b2b;--soft:#faf6f0;}
*{box-sizing:border-box;}body{background:#f0efec;padding:20px;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
#sheet{background:#fff;width:100%;max-width:820px;margin:0 auto;border:2px solid var(--line);}
.sheet-head{padding:16px 10px 4px;text-align:center;}
.sheet-head img{display:block;margin:0 auto 6px;height:44px;}
.sheet-brandbar{display:flex;align-items:center;gap:12px;padding:0 10px 10px;}
.sheet-brandbar .sep{flex:1;height:1px;background:linear-gradient(90deg,rgba(229,53,43,0),var(--brand));}
.sheet-brandbar .sep:last-child{background:linear-gradient(90deg,var(--brand),rgba(229,53,43,0));}
.sheet-title{font-size:21px;font-weight:bold;letter-spacing:4px;}
.sheet-sub{font-size:12px;color:#9a9a9a;text-align:center;padding:0 0 8px;letter-spacing:2px;}
table.doc{width:calc(100% - 16px);margin:0 8px;border-collapse:collapse;table-layout:fixed;}
table.doc td{border:1px solid var(--line);text-align:center;font-size:14px;padding:7px 4px;height:34px;word-break:break-all;}
.lbl{background:var(--soft);font-weight:bold;color:#4a3a2a;white-space:nowrap;}
.hd{background:var(--brand);color:#fff;font-weight:bold;}
.total{color:var(--brand);font-weight:bold;}
.gitem td:first-child{font-weight:bold;}
.signrow td{height:54px;background:#fff;font-size:14px;padding:0 22px;vertical-align:middle;}
.signrow .sigbar{display:flex;align-items:flex-end;gap:60px;}
.signrow .sigitem{display:flex;align-items:flex-end;white-space:nowrap;}
.signrow .sig{border-bottom:1px solid #888;display:inline-block;width:110px;height:20px;margin-left:8px;}
.remark{padding:8px 10px 12px;font-size:12px;color:#666;}
@media print{body{background:#fff;padding:0;}@page{margin:10mm;}}
</style></head><body>${clone}<script>window.onload=()=>window.print()<\/script></body></html>`;
  const blob=new Blob([html],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="调拨托运单_"+($("f_no").value||"导出")+".html";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

// 初始化
$("f_date").value=todayStr();
$("f_no").value=genNo();
if(!load()){addRow();}
fields.forEach(f=>{if(f!=="f_no"&&f!=="f_date")$(f).addEventListener("input",saveAndRefresh);});
refresh();
</script>
</body>
</html>
