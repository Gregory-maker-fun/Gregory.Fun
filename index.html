<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_home">Gregory's tools</title>
<meta name="description" content="Gregory 的内部工具库——把仓配配送现场的实操经验，做成别人也能跑的工具。">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script>
/* 主题预置：防止暗色模式闪白 */
(function(){
  var m=localStorage.getItem('gt_theme')||'auto';
  var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=d?'dark':'light';
})();
</script>
<!-- 公共脚本已内联至 </body> 前，避免外链加载失败导致功能全失效 -->
<style>
  :root{
    --brand:#FF6B35;
    --brand-dark:#D9480F;
    --ink:#1B1F27;
    --ink-2:#4A515E;
    --ink-3:#8A9099;
    --line:#E8E2DB;
    --paper:#FAF8F5;
    --card:#FFFFFF;
    --brand-soft:#FFF1E9;
    --topbar-bg:rgba(250,248,245,.90);
  }
  html[data-theme="dark"]{
    --ink:#ECEDEF;
    --ink-2:#B6BBC4;
    --ink-3:#787E88;
    --line:#2A2E36;
    --paper:#14161B;
    --card:#1C1F26;
    --brand-soft:#33231A;
    --topbar-bg:rgba(20,22,27,.88);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px;}

  /* ---------- 烟花画布 ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:99;}

  /* ---------- 签名品牌标识 ---------- */
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    color:#fff;font-family:Georgia,"Times New Roman",serif;
    font-style:italic;font-weight:700;font-size:19px;line-height:30px;text-align:center;
    transform:rotate(-6deg);
    box-shadow:0 3px 10px rgba(217,72,15,.30);
  }
  .brand-name{
    font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;
    font-size:23px;font-weight:700;letter-spacing:.4px;
    color:var(--ink);transition:color .2s ease;
  }
  .brand:hover .brand-name{color:var(--brand-dark);}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--topbar-bg);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{display:flex;align-items:center;gap:22px;padding:13px 0;}
  .menu{margin-left:auto;display:flex;gap:26px;}
  .menu a{
    font-size:14px;color:var(--ink-2);text-decoration:none;
    padding-bottom:2px;border-bottom:1.5px solid transparent;
    transition:color .18s ease,border-color .18s ease;
  }
  .menu a:hover{color:var(--ink);border-color:var(--brand);}
  .me{
    width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.14);display:block;
  }

  /* ---------- Hero ---------- */
  .hero{
    display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;
    padding:64px 0 72px;min-height:calc(100svh - 62px);
  }
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.05em;color:var(--brand-dark);
    background:var(--brand-soft);padding:6px 13px;border-radius:999px;
  }
  .kicker i{width:6px;height:6px;border-radius:50%;background:var(--brand);}
  .hero h1{
    margin-top:22px;
    font-size:clamp(34px,5.6vw,58px);font-weight:800;
    letter-spacing:-.5px;line-height:1.2;
  }
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero .sub{
    margin-top:18px;font-size:15.5px;color:var(--ink-2);max-width:460px;
  }
  .cta{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    padding:13px 27px;border-radius:999px;
    box-shadow:0 10px 26px rgba(217,72,15,.30);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(217,72,15,.36);}

  /* ---------- 右侧名片卡 ---------- */
  .hero-visual{position:relative;display:flex;justify-content:center;}
  .hero-visual .glow{
    position:absolute;width:340px;height:340px;border-radius:50%;
    background:var(--brand);filter:blur(90px);opacity:.22;top:50%;left:50%;
    transform:translate(-50%,-50%);pointer-events:none;
  }
  html[data-theme="dark"] .hero-visual .glow{opacity:.14;}
  .idcard{
    position:relative;z-index:1;
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:36px 32px 30px;max-width:340px;width:100%;text-align:center;
    transform:rotate(3deg);
    box-shadow:0 26px 60px rgba(217,72,15,.16),0 6px 18px rgba(0,0,0,.06);
    transition:transform .35s ease;
  }
  .idcard:hover{transform:rotate(0deg) translateY(-4px);}
  .idcard img{
    width:118px;height:118px;border-radius:26px;object-fit:cover;
    border:4px solid var(--brand-soft);box-shadow:0 10px 24px rgba(217,72,15,.18);
  }
  .idcard-name{
    margin-top:16px;font-size:26px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .idcard-sign{
    margin-top:10px;font-size:13.5px;color:var(--ink-2);
    font-style:italic;line-height:1.8;
  }

  /* ---------- 页脚 ---------- */
  .foot{
    border-top:1px solid var(--line);
    padding:22px 0 34px;display:flex;justify-content:space-between;align-items:center;gap:18px;
    font-size:12.5px;color:var(--ink-3);
  }
  .foot .sig{font-style:italic;max-width:400px;}
  .foot .meta{text-align:right;display:flex;flex-direction:column;gap:2px;}

  @media(max-width:860px){
    .hero{grid-template-columns:1fr;gap:44px;padding:44px 0 56px;min-height:0;}
    .hero-visual{order:2;}
    .foot{flex-direction:column;gap:14px;}
    .foot .meta{text-align:center;}
  }
  @media(max-width:600px){
    .wrap{padding:0 20px;}
    .brand-mark{width:26px;height:26px;font-size:16px;line-height:26px;border-radius:8px;}
    .brand-name{font-size:19px;}
    .me{width:30px;height:30px;}
    .idcard{padding:28px 22px 24px;}
    .bar-inner{gap:14px;}
  }
</style>
</head>

<header class="topbar">
  <div class="wrap bar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">G</span>
      <span class="brand-name">Gregory's tools</span>
    </a>
    <nav class="menu">
      <a href="tools.html" data-i18n="menu_tools">工具库</a>
    </nav>
    <div class="ctrls"></div>
    <img class="me" src="assets/avatar.jpg" alt="Gregory 头像">
  </div>
</header>

<main class="hero wrap">
  <div class="hero-copy">
    <div class="kicker"><i></i><span data-i18n="kicker">内部工具库 · 持续补充</span></div>
    <h1 data-i18n="hero_h1">把干过的活，<br>做成<em>别人也能跑</em>的工具。</h1>
    <p class="sub" data-i18n="hero_sub">
      这里放的是我从仓配配送现场做出来、能直接交给别人用的东西——
      模板、表格、流程和检查清单，每项都写清楚解决什么问题、怎么用、需要什么前提。
    </p>
    <div class="cta">
      <a class="btn" href="tools.html" data-i18n="btn_enter">进入工具库 →</a>
    </div>
  </div>

  <div class="hero-visual">
    <div class="glow"></div>
    <div class="idcard">
      <img src="assets/avatar.jpg" alt="Gregory 头像">
      <div class="idcard-name">Gregory</div>
      <p class="idcard-sign" data-i18n="sign">目前为止还觉得这个世界挺有意思，还在寻找跟它更好相处的方式</p>
    </div>
  </div>
</main>

<footer class="foot wrap">
  <span class="sig" data-i18n="sign">目前为止还觉得这个世界挺有意思，还在寻找跟它更好相处的方式</span>
  <button class="coffee-btn" data-coffee type="button">
    <span data-i18n="coffee_btn">请我喝杯咖啡</span>
  </button>
  <div class="meta">
    <span data-i18n="foot_use">Gregory's tools · 内部使用 · 工具持续补充</span>
    <span data-i18n-date>最后更新</span>
  </div>
</footer>

".ctrl-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;}",
".ctrl-menu button:hover{background:var(--brand-soft);color:var(--brand-dark);}",
".ctrl-menu button.on{color:var(--brand-dark);background:var(--brand-soft);font-weight:600;}",
".coffee-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:9px 18px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;}",
".coffee-btn:hover{border-color:var(--brand);color:var(--brand-dark);transform:translateY(-1px);box-shadow:0 8px 20px rgba(217,72,15,.12);}",
".coffee-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,17,22,.44);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease;}",
".coffee-overlay.show{opacity:1;}",
".coffee-scene{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:34px 44px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3);transform:scale(.9);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}",
".coffee-overlay.show .coffee-scene{transform:scale(1);}",
".coffee-scene svg{display:block;}",
".coffee-hint{margin-top:14px;font-size:13px;color:var(--ink-3);}",
".coffee-done{margin-top:10px;font-size:16px;font-weight:700;color:var(--brand-dark);opacity:0;}",
".coffee-overlay.play .coffee-done{animation:cfDone .5s ease 2.4s forwards;}",
"@keyframes cfDone{to{opacity:1;}}",
"@keyframes cfStream{from{transform:scaleY(0);}to{transform:scaleY(1);}}",
"@keyframes cfFill{from{transform:scaleY(0);}to{transform:scaleY(1);}}",
"@keyframes cfPot{0%{transform:translateY(-14px);opacity:0;}100%{transform:translateY(0);opacity:1;}}",
"@keyframes cfSteam{0%{opacity:0;transform:translateY(6px);}30%{opacity:.85;}100%{opacity:0;transform:translateY(-14px);}}",
".cf-pot{animation:cfPot .5s ease both;}",
".cf-stream{transform-box:fill-box;transform-origin:top;transform:scaleY(0);}",
".cf-fill{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);}",
".coffee-overlay.play .cf-stream{animation:cfStream .7s ease-in .45s forwards;}",
".coffee-overlay.play .cf-fill{animation:cfFill 1.5s ease-in-out .9s forwards;}",
".cf-steam{opacity:0;stroke:var(--ink-3);stroke-width:3;fill:none;stroke-linecap:round;}",
".coffee-overlay.play .cf-steam{animation:cfSteam 1.8s ease-out 2.3s infinite;}",
".coffee-overlay.play .cf-steam.s2{animation-delay:2.7s;}",
".coffee-overlay.play .cf-steam.s3{animation-delay:3.1s;}"
].join("");

function bindCtrl(id){
  var c=document.getElementById(id);if(!c)return;
  c.querySelector('.ctrl-btn').addEventListener('click',function(e){
    e.stopPropagation();
    var was=c.classList.contains('open');
    document.querySelectorAll('.ctrl.open').forEach(function(x){x.classList.remove('open');});
    if(!was)c.classList.add('open');
  });
}
bindCtrl('langCtrl');bindCtrl('themeCtrl');
document.addEventListener('click',function(){
  document.querySelectorAll('.ctrl.open').forEach(function(x){x.classList.remove('open');});
});

/* ================= 多语言应用 ================= */
function applyLang(){
  document.documentElement.lang=lang==='zh-HK'?'zh-Hant-HK':lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.innerHTML=t(el.getAttribute('data-i18n'));
  });
  var dstr=new Intl.DateTimeFormat(LOCALE[lang],{year:'numeric',month:'long',day:'numeric'}).format(new Date());
  document.querySelectorAll('[data-i18n-date]').forEach(function(el){
    el.textContent=t('foot_updated')+' · '+dstr;
  });
  document.querySelectorAll('.section').forEach(function(sec){
    var n=sec.querySelectorAll('.card').length;
    var c=sec.querySelector('.sec-count');
    if(c)c.textContent=new Intl.NumberFormat(LOCALE[lang]).format(n)+t('count_unit');
  });
  var LKEY={'zh-CN':'lang_zhcn','zh-HK':'lang_zhhk','en':'lang_en'};
  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.innerHTML=(lang===b.getAttribute('data-lang')?'✓ ':'')+t(LKEY[b.getAttribute('data-lang')]);
  });
  var lab=document.getElementById('langLabel');
  if(lab)lab.textContent=t('lang_short');
  localStorage.setItem('gt_lang',lang);
}

/* ================= 白夜模式 ================= */
var mode=localStorage.getItem('gt_theme')||'auto';
var mq=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  var dark=mode==='dark'||(mode==='auto'&&mq.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.dataset.themeMode=mode;
  var ic=document.getElementById('themeIcon');
  if(ic)ic.innerHTML=mode==='dark'?ICON.moon:(mode==='light'?ICON.sun:ICON.auto);
  document.querySelectorAll('[data-theme-opt]').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-theme-opt')===mode);
  });
  localStorage.setItem('gt_theme',mode);
}
if(mq.addEventListener)mq.addEventListener('change',function(){if(mode==='auto')applyTheme();});
document.addEventListener('click',function(e){
  var lb=e.target.closest('[data-lang]');
  if(lb){lang=lb.getAttribute('data-lang');applyLang();return;}
  var tb=e.target.closest('[data-theme-opt]');
  if(tb){mode=tb.getAttribute('data-theme-opt');applyTheme();}
});

/* ================= 烟花 ================= */
var cv=document.getElementById('fx');
if(cv){
  var ctx=cv.getContext('2d'),P=[],raf=null;
  var COLORS=['#FF6B35','#D9480F','#FFB088','#FFD9C4','#FFEDE2','#FFFFFF'];
  function rs(){
    var d=window.devicePixelRatio||1;
    cv.width=innerWidth*d;cv.height=innerHeight*d;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    ctx.setTransform(d,0,0,d,0,0);
  }
  rs();addEventListener('resize',rs);
  function loop(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(var i=P.length-1;i>=0;i--){
      var p=P[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.vx*=0.985;p.vy*=0.985;p.life-=p.dec;
      if(p.life<=0){P.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(p.life,0);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fillStyle=p.c;ctx.fill();
    }
    ctx.globalAlpha=1;
    raf=P.length?requestAnimationFrame(loop):null;
    if(!P.length)ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  addEventListener('click',function(e){
    for(var i=0;i<28;i++){
      var a=Math.random()*6.283,s=2+Math.random()*4.5;
      P.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,
        life:1,dec:0.014+Math.random()*0.02,r:1.5+Math.random()*2.5,
        c:COLORS[(Math.random()*COLORS.length)|0]});
    }
    if(!raf)raf=requestAnimationFrame(loop);
  });
}
